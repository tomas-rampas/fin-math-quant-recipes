name: finmath
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # Core data science packages
  - numpy>=1.20.0
  - pandas>=1.3.0
  - matplotlib>=3.4.0
  - seaborn>=0.11.0
  - scipy>=1.7.0
  # Jupyter support
  - jupyter
  # Statistical and machine learning packages
  - statsmodels>=0.13.0
  - scikit-learn>=1.0.0
  # Financial analysis
  - conda-forge::ta-lib>=0.4.0
  # Time zone handling
  - pytz>=2021.1
  # Additional packages via pip
  - pip:
    - yfinance>=0.1.70
    - pandas-datareader>=0.10.0
    - arch>=5.0.0
